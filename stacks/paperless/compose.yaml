services:
  broker:
    container_name: paperless_broker
    image: redis:8.6.3@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/redis
        target: /data
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
    networks:
      - paperless
  db:
    container_name: paperless_db
    image: postgres:18.4@sha256:f7ce845ee6873dd84be93c9828fe0d1fab0f9707dc9ac569694657398b290bce
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    networks:
      - paperless
  webserver:
    container_name: paperless
    image: paperlessngx/paperless-ngx:2.20.15@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    depends_on:
      - db
      - broker
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/data
        target: /usr/src/paperless/data
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/media
        target: /usr/src/paperless/media
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/consume
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_URL: https://paperless.${DOMAIN}
      TZ: ${TZ:?}
      PAPERLESS_TIME_ZONE: ${TZ:?}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?}
    networks:
      - paperless
      - caddy

networks:
  paperless:
  caddy:
    external: true
