services:
  broker:
    container_name: paperless_broker
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/redis
        target: /data
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
    networks:
      - paperless
  db:
    container_name: paperless_db
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    networks:
      - paperless
  webserver:
    container_name: paperless
    image: paperlessngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    depends_on:
      - db
      - broker
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/data
        target: /usr/src/paperless/data
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/media
        target: /usr/src/paperless/media
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/export
        target: /usr/src/paperless/export
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/paperless/consume
        target: /usr/src/paperless/consume
        bind:
          create_host_path: false
    environment:
      PAPERLESS_TRUSTED_PROXIES: 172.16.0.0/12
      PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: 1
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_URL: https://paperless.${DOMAIN:?}
      TZ: ${TZ:?}
      PAPERLESS_TIME_ZONE: ${TZ:?}
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?}
      PAPERLESS_CONSUMER_ENABLE_BARCODES: true
      PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: true
      PAPERLESS_CONSUMER_BARCODE_UPSCALE: 1.5
      PAPERLESS_CONSUMER_BARCODE_DPI: 600
      PAPERLESS_EMAIL_HOST: mail-eu.smtp2go.com
      PAPERLESS_EMAIL_PORT: 465
      PAPERLESS_EMAIL_HOST_USER: paperless@${DOMAIN:?}
      PAPERLESS_EMAIL_FROM: paperless@${DOMAIN:?}
      PAPERLESS_EMAIL_HOST_PASSWORD: ${PAPERLESS_SMTP_PASSWORD:?}
      PAPERLESS_EMAIL_USE_TLS: false
      PAPERLESS_EMAIL_USE_SSL: true
    networks:
      - paperless
      - caddy

networks:
  paperless:
  caddy:
    external: true
