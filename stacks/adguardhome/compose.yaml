services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v0.107.73@sha256:7fbf01d73ecb7a32d2d9e6cef8bf88e64bd787889ca80a1e8bce30cd4c084442
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/conf
        target: /opt/adguardhome/conf
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/work
        target: /opt/adguardhome/work
        bind:
          create_host_path: false
    ports:
      - ${HOST_IP:?}:53:53/tcp # DNS
      - ${HOST_IP:?}:53:53/udp # DNS
      - 3000:3000/tcp # initial setup
    environment:
      TZ: ${TZ:?}
    networks:
      - caddy
    user: ${PUID:?}:${PGID:?}
networks:
  caddy:
    external: true
