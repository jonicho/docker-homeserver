services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/conf
        target: /opt/adguardhome/conf
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/work
        target: /opt/adguardhome/work
        bind:
          create_host_path: false
    ports:
      - ${HOST_IP:?}:53:53/tcp # DNS
      - ${HOST_IP:?}:53:53/udp # DNS
      - 3000:3000/tcp # initial setup
    environment:
      TZ: ${TZ:?}
    networks:
      - caddy
    user: ${PUID:?}:${PGID:?}
networks:
  caddy:
    external: true
