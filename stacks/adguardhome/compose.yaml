services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v0.107.76@sha256:7157eb1dc3b26c7af1d6898759a7b3f7d0fa09891fbd2d3caa6abc1057a9179b
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/conf
        target: /opt/adguardhome/conf
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/adguardhome/work
        target: /opt/adguardhome/work
        bind:
          create_host_path: false
    ports:
      - ${HOST_IP:?}:53:53/tcp # DNS
      - ${HOST_IP:?}:53:53/udp # DNS
      - 3000:3000/tcp # initial setup
    environment:
      TZ: ${TZ:?}
    networks:
      - caddy
    user: ${PUID:?}:${PGID:?}
networks:
  caddy:
    external: true
