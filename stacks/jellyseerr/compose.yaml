services:
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    user: ${PUID:?}:${PGID:?}
    environment:
      - TZ=${TZ:?}
      - PORT=80
    volumes:
      - ${APPDATA_STORAGE_PATH:?}/jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
      - caddy
networks:
  caddy:
    external: true
