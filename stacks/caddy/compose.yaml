services:
  wireguard:
    container_name: caddy_wireguard
    image: linuxserver/wireguard:1.0.20250521-r1-ls116@sha256:f33891344345b1f78705e723b633e3a3f94d08ae75ca1a5f48c5a449c35bf460
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:?}
      DOMAIN: ${DOMAIN:?}
      HOME_NETWORK: ${HOME_NETWORK:?}
      WG_GATEWAY_PUBLIC_KEY: ${WG_GATEWAY_PUBLIC_KEY:?}
      WG_PRIVATE_KEY: ${WG_CADDY_PRIVATE_KEY:?}
      WG_PRESHARED_KEY: ${WG_CADDY_PRESHARED_KEY:?}
      WG_ADDRESS: 10.0.0.2
    volumes:
      - type: bind
        source: ../../wireguard/ifscript.sh
        target: /ifscript.sh/
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../wireguard/wg0.conf.template
        target: /wg0.conf.template
        read_only: true
        bind:
          create_host_path: false
    entrypoint:
      [
        "bash",
        "-c",
        "apk add --no-cache envsubst && mkdir -p /config/wg_confs && envsubst < /wg0.conf.template > /config/wg_confs/wg0.conf && exec /init",
      ]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks:
      - caddy
      - crowdsec
    dns:
      # set dns to cloudflare so the domain for the wireguard endpoint resolves correctly,
      # even if the domain is rewritten to the local server address locally
      - 1.1.1.1
  caddy:
    container_name: caddy
    build: ./caddybuild
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    cap_add:
      - NET_ADMIN
    volumes:
      - type: bind
        source: ./caddy/
        target: /etc/caddy/
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/caddy/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/caddy/logs
        target: /var/log/caddy
        bind:
          create_host_path: false
    network_mode: service:wireguard
    environment:
      TZ: ${TZ:?}
      DOMAIN: ${DOMAIN:?}
      OLD_NEXTCLOUD_DOMAIN: ${OLD_NEXTCLOUD_DOMAIN:?}
      HOME_NETWORK: ${HOME_NETWORK:?}
      HOST_IP: ${HOST_IP:?}
      CROWDSEC_API_KEY: ${CROWDSEC_API_KEY:?}
networks:
  caddy:
    name: caddy
  crowdsec:
    external: true