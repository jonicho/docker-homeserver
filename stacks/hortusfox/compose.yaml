services:
  hortusfox:
    container_name: hortusfox
    image: ghcr.io/danielbrendel/hortusfox-web:v6.1@sha256:dfe8ad32d41b67074a8fc7ae6196926f96a63acb319199344320697b1183f992
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/img
        target: /var/www/html/public/img
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/logs
        target: /var/www/html/app/logs
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/backup
        target: /var/www/html/public/backup
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/themes
        target: /var/www/html/public/themes
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/migrations
        target: /var/www/html/app/migrations
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      APP_ADMIN_EMAIL: ${HORTUSFOX_ADMIN_EMAIL:?}
      APP_ADMIN_PASSWORD: ${HORTUSFOX_ADMIN_PASSWORD:?}
      APP_TIMEZONE: ${TZ:?}
      APP_UPDATEDEPS: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_PASSWORD: ${HORTUSFOX_DB_PASSWORD:?}
      DB_CHARSET: "utf8mb4"
    networks:
      - hortusfox
      - caddy

  db:
    container_name: hortusfox_db
    image: mariadb:12.3.3@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/hortusfox/db
        target: /var/lib/mysql
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      MARIADB_ROOT_PASSWORD: ${HORTUSFOX_DB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
      MARIADB_PASSWORD: ${HORTUSFOX_DB_PASSWORD:?}
    networks:
      - hortusfox

networks:
  hortusfox:
  caddy:
    external: true
