services:
  seerr:
    container_name: seerr
    image: seerr/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    user: ${PUID:?}:${PGID:?}
    environment:
      TZ: ${TZ:?}
      PORT: "80"
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/seerr/config
        target: /app/config
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - caddy
networks:
  caddy:
    external: true
