services:
  seerr:
    container_name: seerr
    image: seerr/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    user: ${PUID:?}:${PGID:?}
    environment:
      TZ: ${TZ:?}
      PORT: "80"
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/seerr/config
        target: /app/config
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - caddy
networks:
  caddy:
    external: true
