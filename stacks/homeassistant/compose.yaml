services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.3@sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}

  matterjs-server:
    container_name: homeassistant_matterjs-server
    image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
    read_only: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/matter-server
        target: /data
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      ENABLE_TIME_SYNC: 1

  otbr:
    container_name: homeassistant_otbr
    image: openthread/border-router:v2026.09.0@sha256:7616b9d514dee5cc30f572066e05cb775a04c48e07d10f6c43916ce8be88a68f
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - ${OT_RCP_DEVICE:?}:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
    environment:
      OT_RCP_DEVICE: spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800
      OT_INFRA_IF: ${OT_INFRA_IF:?}
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: 7
      TZ: ${TZ:?}
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/otbr
        target: /data
        bind:
          create_host_path: false

  mosquitto:
    container_name: homeassistant_mosquitto
    image: eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    ports:
      - 1883:1883
    environment:
      TZ: ${TZ:?}
    volumes:
      - type: bind
        source: ./mosquitto
        target: /mosquitto/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/mosquitto/data
        target: /mosquitto/data
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/mosquitto/log
        target: /mosquitto/log
        bind:
          create_host_path: false
