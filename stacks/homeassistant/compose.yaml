services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}

  matterjs-server:
    container_name: homeassistant_matterjs-server
    image: ghcr.io/matter-js/matterjs-server:1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
    read_only: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/matter-server
        target: /data
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
      ENABLE_TIME_SYNC: 1

  otbr:
    container_name: homeassistant_otbr
    image: openthread/border-router:v2026.11.0@sha256:5ae17855e42000abce4420098c3cc0f16d8b7cf3745ee091810afad75b37d1cc
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - ${OT_RCP_DEVICE:?}:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
    environment:
      OT_RCP_DEVICE: spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800
      OT_INFRA_IF: ${OT_INFRA_IF:?}
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: 4
      TZ: ${TZ:?}
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/otbr
        target: /data
        bind:
          create_host_path: false

  mosquitto:
    container_name: homeassistant_mosquitto
    image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    user: ${PUID:?}:${PGID:?}
    restart: unless-stopped
    ports:
      - 1883:1883
    environment:
      TZ: ${TZ:?}
    volumes:
      - type: bind
        source: ./mosquitto
        target: /mosquitto/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/mosquitto/data
        target: /mosquitto/data
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/mosquitto/log
        target: /mosquitto/log
        bind:
          create_host_path: false

  zigbee2mqtt:
    container_name: homeassistant_zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    user: ${PUID:?}:${PGID:?}
    group_add:
      - dialout
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/homeassistant/zigbee2mqtt
        target: /app/data
        bind:
          create_host_path: false
    ports:
      - 8082:8080
    environment:
      TZ: ${TZ:?}
    devices:
      - ${ZIGBEE2MQTT_DEVICE:?}:/dev/ttyACM0

