services:
  audiobookshelf:
    container_name: audiobookshelf
    image: advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    networks:
      - caddy
    volumes:
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Podcasts
        target: /podcasts
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/metadata
        target: /metadata
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
networks:
  caddy:
    external: true
