services:
  audiobookshelf:
    container_name: audiobookshelf
    image: advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    networks:
      - caddy
    volumes:
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Podcasts
        target: /podcasts
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/metadata
        target: /metadata
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:?}
networks:
  caddy:
    external: true
