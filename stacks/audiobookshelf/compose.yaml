services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.33.0@sha256:41047b9985f9c38c92ae8b4b34ffd1d77fca36efdfe49c6b962ff2fc8ccae1e9
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    networks:
      - caddy
    volumes:
      - ${MEDIA_STORAGE_PATH:?}/media/Audiobooks:/audiobooks
      - ${MEDIA_STORAGE_PATH:?}/media/Podcasts:/podcasts
      - ${APPDATA_STORAGE_PATH:?}/audiobookshelf/config:/config
      - ${APPDATA_STORAGE_PATH:?}/audiobookshelf/metadata:/metadata
    environment:
      - TZ=${TZ:?}
networks:
  caddy:
    external: true
