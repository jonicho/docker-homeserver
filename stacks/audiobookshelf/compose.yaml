services:
  audiobookshelf:
    container_name: audiobookshelf
    image: advplyr/audiobookshelf:2.33.1@sha256:a4a5841bba093d81e5f4ad1eaedb4da3fda6dbb2528c552349da50ad1f7ae708
    restart: unless-stopped
    user: ${PUID:?}:${PGID:?}
    networks:
      - caddy
    volumes:
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media/Podcasts
        target: /podcasts
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/audiobookshelf/metadata
        target: /metadata
        bind:
          create_host_path: false
    environment:
      - TZ=${TZ:?}
networks:
  caddy:
    external: true
