services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    user: ${PUID:?}:${PGID:?}
    group_add:
      - ${GID_VIDEO:?}
      - ${GID_RENDER:?}
      - ${PGID:?}
    volumes:
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/jellyfin/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_STORAGE_PATH:?}/jellyfin/cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STORAGE_PATH:?}/media
        target: /media
        bind:
          create_host_path: false
      - type: tmpfs
        target: /config/transcodes
        tmpfs:
          mode: 511
    restart: unless-stopped
    environment:
      TZ: ${TZ:?}
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN:?}
    ports:
      - 7359:7359/udp # client discovery
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    networks:
      - caddy
networks:
  caddy:
    external: true
