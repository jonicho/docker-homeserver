services:
  wireguard:
    container_name: gateway_wireguard
    image: linuxserver/wireguard:1.0.20250521-r1-ls109@sha256:8e505886ba5da6788f1b9dfc62a25e2f2c3a96e64e6528ef7278d7e1d6649bd2
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      TZ: ${TZ:?}
      WG_PRIVATE_KEY: ${WG_PRIVATE_KEY:?}
      WG_PEER_PUBLIC_KEY: ${WG_PEER_PUBLIC_KEY:?}
      WG_PRESHARED_KEY: ${WG_PRESHARED_KEY:?}
    volumes:
      - type: bind
        source: ./ifscript.sh
        target: /ifscript.sh/
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./wg0.conf.template
        target: /wg0.conf.template
        read_only: true
        bind:
          create_host_path: false
    entrypoint:
      [
        "bash",
        "-c",
        "apk add --no-cache envsubst && mkdir -p /config/wg_confs && envsubst < /wg0.conf.template > /config/wg_confs/wg0.conf && exec /init",
      ]
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 51821:51821/udp
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped
